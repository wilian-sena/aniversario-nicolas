name: Publicar a Casa Leve

on:
  push:
    branches: [main]
    paths: ['casa-leve/**', '.github/workflows/casa-leve-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: casa-leve
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: casa-leve/package-lock.json

      - run: npm ci

      - name: Verificar (lint, tipos e testes)
        run: npm run check

      - name: Construir para o subdiretório /casa-leve/
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}/casa-leve

      - name: Colocar em /casa-leve/
        run: |
          mkdir -p ../_site/casa-leve
          cp -r out/. ../_site/casa-leve/
          # quem abrir a raiz do Pages vai parar à aplicação
          printf '<!doctype html><meta charset="utf-8"><title>Casa Leve</title><meta http-equiv="refresh" content="0; url=./casa-leve/">' > ../_site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
