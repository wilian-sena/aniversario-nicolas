[build]
  base = "casa-leve"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# O service worker nunca pode ficar preso em cache.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
